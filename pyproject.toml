[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "savesync"
version = "0.1.0"
description = "Resident Windows tray app that synchronizes game saves between a USB drive and the PC using Ludusavi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (derived engine portions: BSD-3-Clause, see LICENSE-UPSTREAM)" }
authors = [{ name = "Pablo Saura" }]
dependencies = [
    "PySide6>=6.6",
    "watchdog>=4.0",
    "psutil>=5.9",
    "xxhash>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-benchmark>=4",
    "pyinstaller>=6",
]

[project.scripts]
savesync = "savesync.app:main"

[project.gui-scripts]
savesync-gui = "savesync.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "ludusavi: needs a real Ludusavi binary (--ludusavi-path or LUDUSAVI_PATH)",
    "windows_only: needs a real Windows host",
    "benchmark: performance benchmark",
]
addopts = "-ra"
